# Build ứng dụng và đăng lên GitHub Pages mỗi khi đẩy mã lên nhánh chính.
# Sau khi chạy xong, app có tại: https://<tên-tài-khoản>.github.io/<tên-repo>/
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, claude/elegant-archimedes-jv6dhb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall sao chép lõi OCR (WASM) + dữ liệu tiếng Việt/Anh vào public/
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
